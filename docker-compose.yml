services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: atk-store-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - atk_store_mqtt_data:/mosquitto/data
      - atk_store_mqtt_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  atk_store_mqtt_data:
  atk_store_mqtt_log:
